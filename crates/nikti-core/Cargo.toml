[package]
name = "nikti-core"
edition.workspace = true
version.workspace = true

[dependencies]
arrow = { workspace = true }
polars = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
md-5 = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
strum = { version = "0.28.0", features = ["derive"] }

[dev-dependencies]
chrono = "0.4"

# The CLAUDE.md Part 4 invariant test suite lives at the repo root
# (tests/invariants.rs) so it reads as binding on the whole system, not
# on one crate's internals — but it's wired here so `cargo test` picks
# it up as an ordinary integration test.
[[test]]
name = "invariants"
path = "../../tests/invariants.rs"
